[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-automation-framework"
version = "0.1.0"
description = "Safety-first, workflow-driven Telegram automation framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Telegram Automation Framework contributors"}]
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "structlog>=24.2,<26",
  "telethon>=1.36,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]
postgres = ["asyncpg>=0.29,<1"]

[project.scripts]
telegram-automation = "telegram_automation.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_automation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["telegram_automation"]
exclude = ["tests"]
