[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleautomata"
version = "1.0.2"
description = "Safety-first, workflow-driven Telegram account automation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Aryan Ghasemi"}]
keywords = ["telegram", "automation", "workflow", "telethon", "async"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.8,<16",
  "SQLAlchemy>=2.0,<3",
  "structlog>=24.2,<26",
  "telethon>=1.36,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]
postgres = ["asyncpg>=0.29,<1"]

[project.scripts]
teleautomata = "teleautomata.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/teleautomata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests favour compact, readable table-style workflow fixtures over strict wrapping.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["teleautomata"]
exclude = ["tests"]

[[tool.mypy.overrides]]
# Telethon ships without type information; isolate that at the adapter boundary
# instead of weakening strictness for the whole project.
module = ["telethon.*"]
ignore_missing_imports = true
