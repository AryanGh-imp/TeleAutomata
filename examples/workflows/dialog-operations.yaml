version: 1
name: dialog-operations
account: primary
dry_run: true
actions:
  - id: mute_noisy_group
    type: mute_dialog
    with:
      target: "@noisy_group"
  - id: pin_important_chat
    type: pin_dialog
    with:
      target: "@important_chat"
  - id: flag_unread
    type: mark_unread
    depends_on: [pin_important_chat]
    with:
      target: "@important_chat"
