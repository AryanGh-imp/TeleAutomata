version: 1
name: member-management
account: primary
dry_run: true
actions:
  - id: add_team
    type: add_members
    with:
      target: "@my_group"
      users: ["@alice", "@bob", "123456789"]
  - id: ban_spammers
    type: ban_members
    with:
      target: "@my_group"
      users_csv: "examples/samples/spammers.csv"
  - id: remove_inactive
    type: remove_members
    depends_on: [add_team]
    with:
      target: "@my_group"
      users: ["@former_member"]
  - id: mute_noisy
    type: mute_members
    with:
      target: "@my_group"
      users: ["@loud_member"]
  - id: restrict_media
    type: restrict_members
    with:
      target: "@my_group"
      users: ["@link_spammer"]
      # false = remove the right; omitted rights stay allowed.
      permissions:
        send_media: false
        embed_link_previews: false
