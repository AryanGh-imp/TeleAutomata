# Resolve targets — read-only lookups that show every accepted target format.
#
# Demonstrates: the target formats TeleAutomata accepts, and that independent
#   actions (no depends_on) form one ready batch instead of a chain.
# Actions: resolve_target
# Inputs: replace the sample targets with ones you can access.
# Credentials: none needed while dry_run is true.
# Validate: teleautomata validate examples/workflows/resolve-targets.yaml
# Dry run:  teleautomata run examples/workflows/resolve-targets.yaml
version: 1
name: resolve-targets
account: primary
dry_run: true
actions:
  - id: by_username
    type: resolve_target
    with:
      target: "@my_channel"                     # public @username
  - id: by_public_link
    type: resolve_target
    with:
      target: "https://t.me/my_channel"         # public t.me link
  - id: by_numeric_id
    type: resolve_target
    with:
      target: "1001234567890"                   # numeric id — quote it so YAML keeps a string
  - id: by_invite_link
    type: resolve_target
    with:
      target: "https://t.me/+AbCdEfGhIjKlMnOp"  # private invite link
