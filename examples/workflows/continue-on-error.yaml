# Tolerating failures with continue_on_error.
#
# Demonstrates: continue_on_error. If `optional_step` fails at runtime it is still
#   counted as failed, but (a) the run does NOT fail as a whole, and (b) its
#   dependant `always_runs` is NOT skipped. Without continue_on_error a failed
#   dependency skips everything downstream and fails the run.
#
#   Under dry_run nothing executes, so nothing actually fails here — this file
#   shows the SHAPE. See examples/README.md to observe the behaviour on a live run.
# Actions: resolve_target, send_message
# Credentials: none needed while dry_run is true.
# Validate: teleautomata validate examples/workflows/continue-on-error.yaml
# Dry run:  teleautomata run examples/workflows/continue-on-error.yaml
version: 1
name: continue-on-error
account: primary
dry_run: true
actions:
  - id: optional_step
    type: resolve_target
    continue_on_error: true
    with:
      target: "@maybe_missing_channel"
  - id: always_runs
    type: send_message
    depends_on: [optional_step]
    with:
      target: "@my_channel"
      message: "This still runs even if the optional step above failed."
