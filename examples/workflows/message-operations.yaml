version: 1
name: message-operations
account: primary
dry_run: true
actions:
  - id: announce
    type: send_message
    with:
      target: "@my_project"
      message: "Release 1.0 is live."
  - id: pin_announcement
    type: pin_message
    depends_on: [announce]
    with:
      target: "@my_project"
      message_id: 1001
  - id: reply_thread
    type: reply_message
    depends_on: [announce]
    with:
      target: "@my_project"
      reply_to_message_id: 1001
      message: "Changelog in the pinned message."
  - id: mark_channel_read
    type: mark_read
    depends_on: [reply_thread]
    with:
      target: "@my_project"
