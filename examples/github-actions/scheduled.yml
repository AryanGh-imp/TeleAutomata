# =============================================================================
# EXAMPLE GitHub Actions workflow — copy me into your repo's .github/workflows/
# =============================================================================
# Scheduled, recurring execution. GitHub only auto-runs workflows in the
# top-level .github/workflows/ directory, so copy this file there (e.g.
# .github/workflows/scheduled.yml) to arm the schedule.
#
# What it does: runs one workflow on a cron schedule, plus a manual button.
# The target here is a dry-run example, so by default the scheduled job performs
# NO real Telegram actions — it exercises the pipeline safely. Point it at a
# live workflow only after reading the security notes below.
#
# ---------------------------------------------------------------------------
# Cron notes
# ---------------------------------------------------------------------------
# * GitHub cron is always UTC — it does not honour your local timezone.
# * The schedule below is "17 8 * * 1" = 08:17 UTC every Monday. Off-zero
#   minutes are deliberate: jobs scheduled exactly on the hour are the most
#   contended and the most likely to be delayed by GitHub.
# * Scheduled runs use the default branch's copy of this file.
#
# ---------------------------------------------------------------------------
# SECURITY — same rules as manual runs
# ---------------------------------------------------------------------------
# * Credentials come from GitHub Secrets (below), never hard-coded.
# * A live run additionally needs an authenticated Telethon session file
#   (password-equivalent), which this example does not provision. Keep the
#   target on a dry_run file unless you have deliberately set that up. See
#   docs/github-actions.md.
# =============================================================================
name: Scheduled workflow

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch: # also allow running it on demand from the Actions tab

env:
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

jobs:
  scheduled-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install teleautomata
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Change this to the workflow you want to run on schedule. Keep it pointed
      # at a dry_run file until you intend real actions to happen automatically.
      - name: Run the scheduled workflow
        run: |
          teleautomata validate examples/workflows/announce-and-pin.yaml
          teleautomata run examples/workflows/announce-and-pin.yaml --yes
